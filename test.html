<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comment Box UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fefbfb;
      padding: 20px;
    }

    .task-container {
      display: flex;
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
      max-width: 800px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .task-content {
      flex: 2;
      padding: 20px;
    }

    .task-content h3 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .comment-box {
      flex: 2;
      border-left: 1px solid #ddd;
      padding: 20px;
      font-size: 14px;
      color: #444;
    }

    .rating-box {
      flex: 1;
      border-left: 1px solid #ddd;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #444;
    }

    .rating-box span {
      font-size: 14px;
      display: block;
      color: #888;
    }

  </style>
</head>
<body>

<div class="task-container">
  <div class="task-content">
    <h3>⚡ Tech requirements</h3>
    <p>Write Complete Description</p>
    <a href="#">📎 Tech Requirement 01.pdf</a>
  </div>
  <div class="comment-box">
    Provides a comprehensive set of tools for managing projects and teams effectively.
  </div>
  <div class="rating-box">
    2/10
    <span>Rating</span>
  </div>
</div>

</body>
</html>
